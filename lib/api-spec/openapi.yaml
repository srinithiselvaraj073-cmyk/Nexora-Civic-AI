openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NEXORA AI community issue reporting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: complaints
  - name: dashboard
  - name: notifications
  - name: departments
  - name: ai
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a citizen account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /complaints:
    get:
      operationId: listComplaints
      tags: [complaints]
      summary: List complaints for the current role
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Complaint list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Submit a community complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Created complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
  /complaints/{id}:
    get:
      operationId: getComplaint
      tags: [complaints]
      summary: Get complaint details and tracking
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: Complaint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "404":
          description: Not found
    patch:
      operationId: updateComplaint
      tags: [complaints]
      summary: Update complaint status, assignment, or resolution
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintUpdate"
      responses:
        "200":
          description: Updated complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
  /complaints/{id}/feedback:
    post:
      operationId: createFeedback
      tags: [complaints]
      summary: Rate a resolved complaint
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /ai/analyze:
    post:
      operationId: analyzeIssue
      tags: [ai]
      summary: Classify an issue with the AI-ready mock service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAnalysisInput"
      responses:
        "200":
          description: AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysis"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Role-aware dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List city departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
components:
  parameters:
    ComplaintId:
      name: id
      in: path
      required: true
      schema:
        type: string
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
    CategoryQuery:
      name: category
      in: query
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [citizen, staff, admin]
        avatar:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    Complaint:
      type: object
      required: [id, title, description, category, priority, status, location, createdAt, updatedAt, reporterName, department, confidence, timeline]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
        status:
          type: string
          enum: [Submitted, Verified, Assigned, In Progress, Resolved]
        location: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        reporterName: { type: string }
        reporterId: { type: string }
        department: { type: string }
        assignedTo: { type: ["string", "null"] }
        confidence: { type: number }
        imageUrl: { type: ["string", "null"] }
        resolutionNotes: { type: ["string", "null"] }
        resolutionPhoto: { type: ["string", "null"] }
        rating: { type: ["number", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
    ComplaintInput:
      type: object
      required: [title, description, category, location, latitude, longitude]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string, minLength: 10 }
        category: { type: string }
        location: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        imageUrl: { type: ["string", "null"] }
    ComplaintUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [Submitted, Verified, Assigned, In Progress, Resolved]
        assignedTo: { type: string }
        department: { type: string }
        resolutionNotes: { type: string }
        resolutionPhoto: { type: string }
    TimelineEvent:
      type: object
      required: [status, label, timestamp]
      properties:
        status: { type: string }
        label: { type: string }
        timestamp: { type: string }
        note: { type: ["string", "null"] }
    FeedbackInput:
      type: object
      required: [rating]
      properties:
        rating: { type: number, minimum: 1, maximum: 5 }
        comment: { type: string }
    Feedback:
      type: object
      required: [id, complaintId, rating]
      properties:
        id: { type: string }
        complaintId: { type: string }
        rating: { type: number }
        comment: { type: ["string", "null"] }
    AiAnalysisInput:
      type: object
      required: [description]
      properties:
        description: { type: string }
        category: { type: string }
    AiAnalysis:
      type: object
      required: [category, priority, confidence, department, summary]
      properties:
        category: { type: string }
        priority: { type: string }
        confidence: { type: number }
        department: { type: string }
        summary: { type: string }
    DashboardSummary:
      type: object
      required: [total, pending, inProgress, resolved, highPriority, avgResolutionHours, byCategory, weeklyVolume, recentActivity]
      properties:
        total: { type: integer }
        pending: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        highPriority: { type: integer }
        avgResolutionHours: { type: number }
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        weeklyVolume:
          type: array
          items:
            $ref: "#/components/schemas/DayCount"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string }
        count: { type: integer }
    DayCount:
      type: object
      required: [day, count]
      properties:
        day: { type: string }
        count: { type: integer }
    Activity:
      type: object
      required: [id, title, status, time]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        time: { type: string }
    Notification:
      type: object
      required: [id, title, message, type, createdAt, read]
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        createdAt: { type: string }
        read: { type: boolean }
    Department:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }